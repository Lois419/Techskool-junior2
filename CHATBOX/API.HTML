<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LearnHub AI Messaging</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./API.CSS" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <style>
      body {
        background: linear-gradient(120deg, #e0e7ff 0%, #f8fafc 100%);
        min-height: 100vh;
        font-family: "Segoe UI", Arial, sans-serif;
      }
      .chat-container {
        max-width: 600px;
        margin: 48px auto;
        box-shadow: 0 8px 32px rgba(37, 99, 235, 0.1);
        border-radius: 20px;
        background: #fff;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 70vh;
      }
      .chat-header {
        background: linear-gradient(90deg, #2563eb, #1e40af);
        color: #fff;
        padding: 2rem 1.5rem 1rem 1.5rem;
        text-align: center;
        border-bottom: 1px solid #e0e7ef;
      }
      .chat-header h2 {
        font-weight: 700;
        margin-bottom: 0.5rem;
        letter-spacing: 1px;
      }
      .chat-header p {
        font-size: 1.1rem;
        opacity: 0.85;
        margin-bottom: 0;
      }
      .chat-box {
        flex: 1;
        overflow-y: auto;
        padding: 2rem 1.5rem 1rem 1.5rem;
        background: #f1f5f9;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        scroll-behavior: smooth;
      }
      .message {
        display: flex;
        align-items: flex-end;
        gap: 0.5rem;
      }
      .message.user {
        justify-content: flex-end;
      }
      .message.bot {
        justify-content: flex-start;
      }
      .bubble {
        padding: 1rem 1.25rem;
        border-radius: 18px;
        max-width: 75%;
        font-size: 1.08rem;
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.07);
        word-break: break-word;
        line-height: 1.5;
      }
      .message.user .bubble {
        background: linear-gradient(90deg, #2563eb, #1e40af);
        color: #fff;
        align-self: flex-end;
      }
      .message.bot .bubble {
        background: #e0e7ef;
        color: #222;
        align-self: flex-start;
      }
      .chat-footer {
        display: flex;
        gap: 0.5rem;
        padding: 1.25rem 1.5rem;
        background: #f8fafc;
        border-top: 1px solid #e5e7eb;
      }
      #user-input {
        flex: 1;
        border-radius: 10px;
        border: 1px solid #cbd5e1;
        padding: 0.75rem 1rem;
        font-size: 1.08rem;
        background: #fff;
        transition: border 0.2s;
      }
      #user-input:focus {
        border-color: #2563eb;
        outline: none;
      }
      #send-button {
        border-radius: 10px;
        font-size: 1.3rem;
        padding: 0.75rem 1.5rem;
        background: linear-gradient(90deg, #2563eb, #1e40af);
        color: #fff;
        border: none;
        transition: background 0.2s;
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.07);
      }
      #send-button:hover {
        background: #1e40af;
      }
    </style>
  </head>
  <body>
    <div class="chat-container">
      <div class="chat-header">
        <h2>LearnHub AI Messaging</h2>
        <p>Chat with your smart assistant about anything!</p>
      </div>
      <div class="chat-box" id="chat-box" aria-live="polite" tabindex="0">
        <div class="message bot">
          <div class="bubble">
            Hello! I am Dani, your AI assistant. How can I help you today?
          </div>
        </div>
      </div>
      <form
        class="chat-footer"
        id="chat-form"
        autocomplete="off"
        aria-label="Send message"
      >
        <input
          type="text"
          id="user-input"
          placeholder="Type your message..."
          aria-label="Type your message"
          required
        />
        <button type="submit" id="send-button" aria-label="Send">
          <span class="material-symbols-rounded">send</span>
        </button>
      </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="API.js"></script>
    <script>
      // Use Gemini AI for messaging
      import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";
      const API_KEY = "AIzaSyBnsvIwr1PBfs6pCVosvUNryXHgRDYEFHQ";
      const genAI = new GoogleGenerativeAI(API_KEY);
      const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

      const chatBox = document.getElementById("chat-box");
      const chatForm = document.getElementById("chat-form");
      const userInput = document.getElementById("user-input");
      const sendButton = document.getElementById("send-button");

      function addMessage(sender, text) {
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${sender}`;
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;
        msgDiv.appendChild(bubble);
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      async function sendMessageToGemini(message) {
        addMessage("user", message);
        userInput.value = "";
        try {
          const result = await model.generateContent(message);
          const response = await result.response;
          const text = response.text();
          addMessage("bot", text);
        } catch (error) {
          addMessage(
            "bot",
            "Sorry, I couldn't process your request. Please try again."
          );
        }
      }

      chatForm.addEventListener("submit", function (e) {
        e.preventDefault();
        const text = userInput.value.trim();
        if (!text) return;
        sendMessageToGemini(text);
      });

      userInput.addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
          const text = userInput.value.trim();
          if (text) {
            sendMessageToGemini(text);
          }
        }
      });
    </script>
  </body>
</html>
